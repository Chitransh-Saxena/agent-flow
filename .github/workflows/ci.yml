name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: bash scripts/build-site.sh
      - name: Sanity-check the output
        run: |
          test -f deploy/index.html
          test -f deploy/app.js
          test -f deploy/workflows.js
          test -f deploy/style.css
